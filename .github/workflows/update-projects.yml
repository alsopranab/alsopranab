name: Update Projects Showcase

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch repositories and generate project list
        uses: actions/github-script@v7
        with:
          script: |
            const username = "alsopranab";
            const topicsMap = {
              "data-analysis": "Data Analysis Projects",
              "sql": "SQL Projects",
              "dashboard": "Dashboards"
            };

            const repos = await github.paginate(
              github.rest.repos.listForUser,
              { username, per_page: 100 }
            );

            const formatName = (name) =>
              name
                .replace(/[-_]/g, " ")
                .replace(/\b\w/g, c => c.toUpperCase());

            let output = "";

            for (const [topic, section] of Object.entries(topicsMap)) {
              const filtered = repos.filter(r =>
                r.topics && r.topics.includes(topic)
              );

              if (filtered.length === 0) continue;

              output += `### ${section}\n\n`;

              filtered.forEach(repo => {
                output += `- **${formatName(repo.name)}** → ${repo.html_url}\n`;
              });

              output += "\n";
            }

            const fs = require("fs");
            const readme = fs.readFileSync("README.md", "utf8");

            const updated = readme.replace(
              /<!-- PROJECTS:START -->([\s\S]*?)<!-- PROJECTS:END -->/,
              `<!-- PROJECTS:START -->\n\n${output}<!-- PROJECTS:END -->`
            );

            fs.writeFileSync("README.md", updated);

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git commit -m "Auto-update project showcase" || exit 0
          git push
