name: Auto Update Project Showcase

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate project list from GitHub topics
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const username = "alsopranab";

            // Priority order (top = strongest signal)
            const sections = [
              { topic: "etl", title: "ETL & Data Engineering" },
              { topic: "machine-learning", title: "Machine Learning Projects" },
              { topic: "ml", title: "Machine Learning Projects" },
              { topic: "automation", title: "Automation Projects" },
              { topic: "python", title: "Python Projects" },
              { topic: "sql", title: "SQL Projects" },
              { topic: "statistics", title: "Statistics Projects" },
              { topic: "excel", title: "Excel Projects" }
            ];

            const repos = await github.paginate(
              github.rest.repos.listForUser,
              {
                username,
                per_page: 100,
                headers: {
                  accept: "application/vnd.github.mercy-preview+json"
                }
              }
            );

            const cleanName = (name) =>
              name
                .replace(/[-_]+/g, " ")
                .replace(/\b\w/g, c => c.toUpperCase());

            const usedRepos = new Set();
            let output = "";

            for (const section of sections) {
              const matched = repos
                .filter(repo =>
                  !repo.fork &&
                  !repo.archived &&
                  repo.topics?.includes(section.topic) &&
                  !usedRepos.has(repo.name)
                )
                .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));

              if (!matched.length) continue;

              output += `### ${section.title}\n\n`;

              matched.forEach(repo => {
                usedRepos.add(repo.name);
                output += `- **${cleanName(repo.name)}** → ${repo.html_url}\n`;
              });

              output += "\n";
            }

            const readme = fs.readFileSync("README.md", "utf8");

            const updated = readme.replace(
              /<!-- PROJECTS:START -->([\s\S]*?)<!-- PROJECTS:END -->/,
              `<!-- PROJECTS:START -->\n\n${output}<!-- PROJECTS:END -->`
            );

            fs.writeFileSync("README.md", updated);

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git commit -m "chore: auto-update project showcase" || exit 0
          git push
