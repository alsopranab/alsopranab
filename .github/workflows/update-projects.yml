name: Auto Update Project Showcase

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate project list from GitHub topics
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const username = "alsopranab";

            const sections = {
              "data-analysis": "Data Analysis Projects",
              "sql": "SQL Projects",
              "python": "Python Projects",
              "etl": "ETL & Data Engineering",
              "machine-learning": "Machine Learning Projects",
              "deep-learning": "Deep Learning Projects",
              "dashboard": "Dashboards & BI",
              "automation": "Automation Projects",
              "practice": "Practice & Learning"
            };

            const repos = await github.paginate(
              github.rest.repos.listForUser,
              { username, per_page: 100 }
            );

            const cleanName = (name) =>
              name
                .replace(/[-_]+/g, " ")
                .replace(/\b\w/g, c => c.toUpperCase());

            let output = "";

            for (const [topic, title] of Object.entries(sections)) {
              const filtered = repos
                .filter(repo =>
                  !repo.fork &&
                  !repo.archived &&
                  repo.topics?.includes(topic)
                )
                .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));

              if (!filtered.length) continue;

              output += `### ${title}\n\n`;

              filtered.forEach(repo => {
                output += `- **${cleanName(repo.name)}** → ${repo.html_url}\n`;
              });

              output += "\n";
            }

            const readme = fs.readFileSync("README.md", "utf8");

            const updated = readme.replace(
              /<!-- PROJECTS:START -->([\s\S]*?)<!-- PROJECTS:END -->/,
              `<!-- PROJECTS:START -->\n\n${output}<!-- PROJECTS:END -->`
            );

            fs.writeFileSync("README.md", updated);

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git commit -m "chore: auto-update project showcase" || exit 0
          git push
