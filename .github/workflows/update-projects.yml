name: Auto Update Project Showcase

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # Runs daily at 03:00 UTC
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate project list from GitHub repositories
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const username = "alsopranab";

            // Ordered from strongest → weakest signal
            const sections = [
              { topic: "etl", title: "ETL & Data Engineering" },
              { topic: "machine-learning", title: "Machine Learning Projects" },
              { topic: "automation", title: "Automation Projects" },
              { topic: "python", title: "Python Projects", language: "Python" },
              { topic: "sql", title: "SQL Projects" },
              { topic: "statistics", title: "Statistics Projects" },
              { topic: "excel", title: "Excel Projects" }
            ];

            // Fetch repositories
            const repos = await github.paginate(
              github.rest.repos.listForUser,
              {
                username,
                per_page: 100,
                headers: {
                  accept: "application/vnd.github+json"
                }
              }
            );

            const cleanName = (name) =>
              name
                .replace(/[-_]+/g, " ")
                .replace(/\b\w/g, c => c.toUpperCase());

            const usedRepos = new Set();
            let output = "";

            for (const section of sections) {
              const matched = repos
                .filter(repo =>
                  !repo.fork &&
                  !repo.archived &&
                  !usedRepos.has(repo.name) &&
                  (
                    repo.topics?.includes(section.topic) ||
                    (section.language && repo.language === section.language)
                  )
                )
                .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));

              if (!matched.length) continue;

              output += `### ${section.title}\n\n`;

              matched.forEach(repo => {
                usedRepos.add(repo.name);
                output += `- **${cleanName(repo.name)}** → ${repo.html_url}\n`;
              });

              output += "\n";
            }

            if (!output.trim()) {
              console.log("No matching repositories found. README not updated.");
              return;
            }

            const readme = fs.readFileSync("README.md", "utf8");

            if (
              !readme.includes("<!-- PROJECTS:START -->") ||
              !readme.includes("<!-- PROJECTS:END -->")
            ) {
              throw new Error(
                "README markers not found. Add <!-- PROJECTS:START --> and <!-- PROJECTS:END -->"
              );
            }

            const updatedReadme = readme.replace(
              /<!-- PROJECTS:START -->([\s\S]*?)<!-- PROJECTS:END -->/,
              `<!-- PROJECTS:START -->\n\n${output}<!-- PROJECTS:END -->`
            );

            fs.writeFileSync("README.md", updatedReadme);

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git commit -m "chore: auto-update project showcase" || echo "No changes to commit"
          git push
